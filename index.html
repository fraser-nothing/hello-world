<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    background-color: #ece2d4;
    text-align: center;
    padding: 2rem;
    box-sizing: border-box;
  }
  h1 {
    font-family: "Playfair Display", serif;
    font-weight: 600;
    color: #3f2e26;
    font-size: 2.2rem;
    max-width: 30ch;
    margin: 0;
  }
  img {
    max-width: 500px;
    width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(63, 46, 38, 0.25);
  }
</style>
</head>
<body>
<h1>Hello, my name is Fraser and this is my dog Skipper</h1>
<img src="skipper.jpg" alt="Skipper the dog">
</body>
</html>
